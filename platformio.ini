[platformio]
src_dir = examples/PlatformIO
default_envs = esp32s3

[env]
framework = arduino
monitor_speed = 921600
lib_deps = symlink://.
build_flags = -I src

[env:esp32s3]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -D ARDUINO_USB_CDC_ON_BOOT=1

[env:stm32f411]
platform = ststm32@19.7.1
board = blackpill_f411ce
build_flags = ${env.build_flags} -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC

[env:esp32s3_i2c]
extends = env:esp32s3
build_flags = ${env:esp32s3.build_flags} -D TTIMU_I2C_EXAMPLE=1

[env:stm32f411_i2c]
extends = env:stm32f411
build_flags = ${env:stm32f411.build_flags} -D TTIMU_I2C_EXAMPLE=1
